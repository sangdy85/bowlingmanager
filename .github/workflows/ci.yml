name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholders; no real secrets or production data are used in CI.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs
      - run: npx next build

  mobile:
    name: Mobile (flutter analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: pubspec needs Dart ^3.13.3 (Flutter 3.50.1+), and later
          # stable releases deprecate package:flutter/material.dart, which makes
          # `flutter analyze` fail on every screen. Upgrade deliberately.
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
